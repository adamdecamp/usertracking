name: Signed public release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  sign-and-release:
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify release-clean source
        shell: pwsh
        run: ./scripts/Test-ReleaseClean.ps1 -SourceOnly

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Security and quality checks
        run: |
          pnpm audit --prod --audit-level low
          pnpm lint
          pnpm test
          pnpm build

      - name: Test Windows launcher and network-share fault recovery
        shell: pwsh
        run: ./scripts/Test-NetworkShareChaos.ps1

      - name: Build standalone executable
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Sign in to Microsoft Azure
        uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign and timestamp executable
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\release\InformationSystemUserTracker.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Information System User Tracker
          description-url: ${{ github.server_url }}/${{ github.repository }}

      - name: Verify signature and refresh checksum
        shell: pwsh
        run: |
          $file = "release\InformationSystemUserTracker.exe"
          $summary = "release\Information-System-User-Tracker-Executive-Summary.pdf"
          $signature = Get-AuthenticodeSignature -FilePath $file
          if ($signature.Status -ne 'Valid') { throw "Authenticode signature verification failed: $($signature.Status)" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          $summaryHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $summary).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "release\SHA256SUMS.txt" -Encoding ascii -Value @("$hash  InformationSystemUserTracker.exe", "$summaryHash  Information-System-User-Tracker-Executive-Summary.pdf")

      - name: Verify release-clean signed package
        shell: pwsh
        run: ./scripts/Test-ReleaseClean.ps1

      - name: Create evidence artifact directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/information-system-user-tracker.spdx.json
          upload-artifact: false

      - name: Attest signed executable and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/InformationSystemUserTracker.exe
          sbom-path: artifacts/information-system-user-tracker.spdx.json

      - name: Attest signed release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/InformationSystemUserTracker.exe
            release/Information-System-User-Tracker-Executive-Summary.pdf
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release\InformationSystemUserTracker.exe" `
            "release\Information-System-User-Tracker-Executive-Summary.pdf" `
            "release\SHA256SUMS.txt" `
            "artifacts\information-system-user-tracker.spdx.json" `
            --verify-tag `
            --generate-notes `
            --title "Information System User Tracker ${{ github.ref_name }}"
